<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accordion</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="accordion">
        <div class="item">
            <button class="accordion-btn" aria-expanded="false">Click me</button>
        

            <div class="panel">
                <p>Shouldn't have clicked me mate.</p>
            </div>
        </div>

        <div class="item">
            <button class="accordion-btn" aria-expanded="false">Try me</button>
        

            <div class="panel">
                <p>Nope. Bad choice again!</p>
            </div>
        </div>
    </div>
    <script src="js/script.js"></script>
</body>
</html>
